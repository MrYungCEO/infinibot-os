<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>InfiniBot Browser Relay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        width: 310px;
        margin: 0;
        padding: 16px;
        color: #f8fafc;
        background: radial-gradient(circle at top right, #342610, #090909 48%);
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      img {
        width: 34px;
        height: 34px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
      }
      p {
        margin: 3px 0 0;
        color: #94a3b8;
        font-size: 11px;
      }
      .status {
        padding: 11px;
        border: 1px solid #3a2d13;
        background: #11100d;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.5;
        margin-bottom: 10px;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 7px;
        background: #64748b;
      }
      .dot.on {
        background: #22c55e;
        box-shadow: 0 0 10px #22c55e;
      }
      button {
        width: 100%;
        border: 1px solid #5a4318;
        color: #f5d98b;
        background: #17130a;
        border-radius: 9px;
        padding: 9px 10px;
        margin-top: 7px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button.primary {
        color: #111;
        background: linear-gradient(135deg, #d4af37, #f0d985);
        border: 0;
        font-weight: 700;
      }
      button.danger {
        color: #fca5a5;
        border-color: #7f1d1d;
        background: #210d0d;
      }
      #message {
        min-height: 15px;
        margin-top: 9px;
        color: #fbbf24;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <div>
        <h1>InfiniBot Browser Relay</h1>
        <p>Your Chrome profile stays on this machine.</p>
      </div>
    </header>
    <div class="status">
      <span id="dot" class="dot"></span><strong id="state">Checking…</strong><br /><span
        id="detail"
      ></span>
    </div>
    <button id="toggle" class="primary">Grant current tab</button>
    <button id="pause" class="danger">Pause all browser control</button>
    <button id="settings">Pairing & settings</button>
    <div id="message" role="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
