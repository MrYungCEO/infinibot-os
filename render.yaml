services:
  - type: web
    name: infinibot
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: INFINIBOT_STATE_DIR
        value: /data/.infinibot
      - key: INFINIBOT_WORKSPACE_DIR
        value: /data/workspace
      - key: INFINIBOT_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: infinibot-data
      mountPath: /data
      sizeGB: 1
