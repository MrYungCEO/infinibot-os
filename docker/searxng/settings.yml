# Minimal SearXNG settings for InfiniBot Secure Mode research.
# Everything not set here comes from SearXNG's defaults.
use_default_settings: true

general:
  instance_name: "InfiniBot secure search"
  enable_metrics: false

server:
  # Replaced by SEARXNG_SECRET from docker-compose.yml.
  secret_key: "change-me-local-only"
  # Only the local gateway talks to this instance.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  # The gateway asks for JSON.
  formats:
    - html
    - json

ui:
  query_in_title: false

# Keep the AI answer engines out of Secure Mode research: only classic web
# indexes receive the sanitized query.
engines:
  - name: wikipedia
    disabled: false
  - name: brave
    disabled: true
  - name: startpage
    disabled: false
