<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Whiteboard plugin cover</title>
  <desc id="desc">Abstract gold diagram nodes and connectors on a black drafting grid.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#17140c"/><stop offset="1" stop-color="#050505"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a8"/><stop offset=".45" stop-color="#fbbf24"/><stop offset="1" stop-color="#b86b08"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fbbf24" stroke-opacity=".075"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <g opacity=".22" stroke="#fbbf24" fill="none"><circle cx="140" cy="150" r="90"/><circle cx="1460" cy="760" r="150"/><path d="M0 720C420 520 610 940 990 710S1410 490 1600 590"/></g>
  <g transform="translate(294 202)" stroke="url(#gold)" stroke-width="5" fill="#0c0b08" filter="url(#glow)">
    <rect x="0" y="80" width="280" height="150" rx="28"/><path d="M280 155H430"/><path d="m405 130 30 25-30 25"/>
    <rect x="430" y="20" width="300" height="150" rx="28"/><path d="M580 170v120"/><path d="m555 265 25 30 25-30"/>
    <path d="M580 290 735 385 580 480 425 385Z"/><path d="M735 385H900"/><path d="m875 360 30 25-30 25"/>
    <rect x="900" y="310" width="280" height="150" rx="75"/>
  </g>
  <g fill="#f8fafc" font-family="Inter,Arial,sans-serif"><text x="120" y="690" font-size="94" font-weight="750" letter-spacing="-3">WHITEBOARD</text><text x="126" y="758" font-size="28" fill="#d6b96a" letter-spacing="7">THINK • DRAW • DIRECT</text></g>
  <g transform="translate(1320 105) rotate(-12)" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"><path d="M0 150 58 0l42 17-58 150-42 25Z"/><path d="m58 0 42 17"/></g>
</svg>
