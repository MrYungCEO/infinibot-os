name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: "22"
  PNPM_VERSION: "10.23.0"

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            # TODO(OSS-W3): remove this fallback after W3 commits pnpm-lock.yaml.
            echo "::warning file=pnpm-lock.yaml::Lockfile missing; using a non-frozen install until OSS W3 lands it."
            pnpm install --no-frozen-lockfile
          fi

  build:
    name: Build and typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            # TODO(OSS-W3): remove this fallback after W3 commits pnpm-lock.yaml.
            echo "::warning file=pnpm-lock.yaml::Lockfile missing; using a non-frozen install until OSS W3 lands it."
            pnpm install --no-frozen-lockfile
          fi
      # tsc over the full tree peaks just above Node's default 2 GB heap when
      # it emits (the build step); give both steps the same headroom as the
      # UI build and the publish workflow.
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  ui-build:
    name: UI build
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            # TODO(OSS-W3): remove this fallback after W3 commits pnpm-lock.yaml.
            echo "::warning file=pnpm-lock.yaml::Lockfile missing; using a non-frozen install until OSS W3 lands it."
            pnpm install --no-frozen-lockfile
          fi
      # The control UI bundle peaks near 5 GB; Node's default 2 GB heap runs
      # out of memory.
      - run: pnpm ui:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  unit-tests:
    name: Unit tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            # TODO(OSS-W3): remove this fallback after W3 commits pnpm-lock.yaml.
            echo "::warning file=pnpm-lock.yaml::Lockfile missing; using a non-frozen install until OSS W3 lands it."
            pnpm install --no-frozen-lockfile
          fi
      - name: Build generated test fixture
        run: pnpm canvas:a2ui:bundle
      - name: Root unit tests
        run: pnpm test
      - name: UI pure-logic tests
        run: pnpm -C ui test

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            # TODO(OSS-W3): remove this fallback after W3 commits pnpm-lock.yaml.
            echo "::warning file=pnpm-lock.yaml::Lockfile missing; using a non-frozen install until OSS W3 lands it."
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm lint

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the pull request's commits through the API, which
    # needs pull-requests: read on top of the workflow-level contents: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml

  license-compliance:
    name: License compliance
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check LICENSE, NOTICE and manifest license fields
        run: node scripts/check-license-fields.mjs
      - name: Install dependencies
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            # TODO(OSS-W3): remove this fallback after W3 commits pnpm-lock.yaml.
            echo "::warning file=pnpm-lock.yaml::Lockfile missing; using a non-frozen install until OSS W3 lands it."
            pnpm install --no-frozen-lockfile
          fi
      - name: Check dependency licenses
        # Not blocking yet: the scan found 4 production dependencies whose
        # licenses are incompatible with FSL distribution (details and the
        # remediation plan are in the dependency license scan report,
        # /tmp/fsl-license-scan/REPORT.md on the release machine). Remove
        # continue-on-error once those are replaced or cleared.
        continue-on-error: true
        run: node scripts/check-licenses.mjs
