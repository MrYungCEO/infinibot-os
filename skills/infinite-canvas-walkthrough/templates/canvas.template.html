<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>__TITLE__</title>
<meta name="description" content="__SUBTITLE__" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23f4d77a'/><stop offset='1' stop-color='%23d4af37'/></linearGradient></defs><rect x='16' y='16' width='480' height='480' rx='96' fill='%23050507' stroke='%23d4af37' stroke-width='10'/><ellipse cx='256' cy='276' rx='186' ry='76' fill='none' stroke='%23d4af37' stroke-width='12' stroke-dasharray='40 24'/><polygon points='256,150 412,276 256,402 100,276' fill='%2314110a' stroke='url(%23g)' stroke-width='16'/><polygon points='256,224 308,276 256,328 204,276' fill='url(%23g)'/></svg>" />
<style>
__THEME_CSS__
</style>
</head>
<body>
  <div id="bg-radial"></div>
  <div id="bg-grid"></div>
  <canvas id="stars"></canvas>
  <div id="vignette"></div>

  <div id="viewport">
    <div id="world">
      <svg id="links" viewBox="0 0 __WORLD_W__ __WORLD_H__" preserveAspectRatio="none">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9a7b1f" stop-opacity=".15"/>
            <stop offset=".5" stop-color="#f4d77a" stop-opacity=".85"/>
            <stop offset="1" stop-color="#d4af37" stop-opacity=".25"/>
          </linearGradient>
        </defs>
        <g id="link-paths"></g>
      </svg>
    </div>
  </div>

  <!-- HUD -->
  <div class="hud" id="topbar">
    <div class="logo"><div class="dot"></div><div class="ttl">__BRAND__</div></div>
    <div class="sep"></div>
    <div class="meta">__SUBTITLE__</div>
  </div>

  <div class="hud" id="zoomctl">
    <button class="btn icon" id="zin" title="Zoom in">+</button>
    <button class="btn icon" id="zout" title="Zoom out">−</button>
    <button class="btn icon" id="zfit" title="Fit all" style="font-size:14px">⤢</button>
    <div id="zlevel">100%</div>
  </div>

  <div class="hud" id="tour">
    <span class="label">Guided&nbsp;Tour</span>
    <button class="btn" id="tprev">‹ Prev</button>
    <span class="stopname" id="tname">Start here →</span>
    <button class="btn" id="tnext">Next ›</button>
    <span class="count" id="tcount">0 / 0</span>
  </div>

  <div class="hud" id="minimap"><span id="mm-label">Sector Map</span><canvas id="mm"></canvas></div>

  <div class="hud" id="help">
    <b>Drag</b> to pan · <b>Wheel / pinch</b> to zoom<br>
    <b>Guided Tour</b> flies between nodes<br>
    Click the <b>minimap</b> to jump.
  </div>

<script>
/* ============================================================
   InfiniBot · Infinite Canvas Walkthrough — engine
   Generated by skills/infinite-canvas-walkthrough/build.mjs
   ============================================================ */

/* ---------- starfield ---------- */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');let w,h,stars,t=0;
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;
    const n=Math.min(220,Math.round(w*h/9000));
    stars=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,
      r:Math.random()*1.5+.3,b:Math.random()*.6+.2,s:Math.random()*.9+.2,p:Math.random()*6.28}));}
  function frame(){t+=.016;x.clearRect(0,0,w,h);
    for(const o of stars){const tw=o.b*(.6+.4*Math.sin(t*o.s+o.p));
      x.beginPath();x.arc(o.x,o.y,o.r,0,6.283);
      const g=o.r>1.1?'212,175,55':'200,210,235';
      x.fillStyle='rgba('+g+','+tw+')';x.fill();}
    requestAnimationFrame(frame);}
  addEventListener('resize',resize);resize();frame();
})();

/* ---------- diagrams (animated SVG snippets, inlined at build) ---------- */
const DIA = __DIA__;

/* ---------- nodes & links (inlined at build) ---------- */
const NODES = __NODES__;
const LINKS = __LINKS__;
const TOUR  = __TOUR__;

/* ---------- render nodes ---------- */
const world=document.getElementById('world');
const nodeEls={};
for(const n of NODES){
  const el=document.createElement('div');
  el.className='node '+(n.cls||'');
  el.id='n-'+n.id;
  el.style.left=n.x+'px'; el.style.top=n.y+'px'; el.style.width=n.w+'px';
  if(n.cl) el.style.setProperty('--cl', n.cl);
  let inner=n.html;
  if(n.part) inner=`<div class="part-tag">${n.part}</div>`+inner;
  el.innerHTML=inner;
  world.appendChild(el);
  nodeEls[n.id]=el;
}

/* ---------- draw connectors ---------- */
const linkG=document.getElementById('link-paths');
function nodeCenter(id){const e=nodeEls[id];return {x:e.offsetLeft+e.offsetWidth/2, y:e.offsetTop+e.offsetHeight/2, w:e.offsetWidth, h:e.offsetHeight, l:e.offsetLeft, t:e.offsetTop};}
function buildLinks(){
  linkG.innerHTML='';
  for(const link of LINKS){
    const a=link[0], b=link[1];
    if(!nodeEls[a]||!nodeEls[b])continue;
    const A=nodeCenter(a), B=nodeCenter(b);
    const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    const dx=B.x-A.x, dy=B.y-A.y; const len=Math.hypot(dx,dy)||1;
    const off=Math.min(120, len*0.18);
    const cx=mx - dy/len*off, cy=my + dx/len*off;
    const d=`M ${A.x} ${A.y} Q ${cx} ${cy} ${B.x} ${B.y}`;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d); p.setAttribute('fill','none');
    p.setAttribute('stroke','url(#lg)'); p.setAttribute('stroke-width','2');
    p.setAttribute('stroke-linecap','round'); p.setAttribute('opacity','.85');
    linkG.appendChild(p);
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('r','3.2'); dot.setAttribute('fill','#f4d77a'); dot.setAttribute('opacity','.9');
    const am=document.createElementNS('http://www.w3.org/2000/svg','animateMotion');
    am.setAttribute('dur',(3+Math.random()*2).toFixed(2)+'s'); am.setAttribute('repeatCount','indefinite'); am.setAttribute('path',d);
    dot.appendChild(am); linkG.appendChild(dot);
    const p2=document.createElementNS('http://www.w3.org/2000/svg','path');
    p2.setAttribute('d',d); p2.setAttribute('fill','none'); p2.setAttribute('stroke','#f4d77a');
    p2.setAttribute('stroke-width','1'); p2.setAttribute('stroke-dasharray','2 14'); p2.setAttribute('opacity','.5');
    const an=document.createElementNS('http://www.w3.org/2000/svg','animate');
    an.setAttribute('attributeName','stroke-dashoffset'); an.setAttribute('from','0'); an.setAttribute('to','-160');
    an.setAttribute('dur','4s'); an.setAttribute('repeatCount','indefinite'); p2.appendChild(an);
    linkG.appendChild(p2);
  }
}

/* ---------- pan / zoom engine ---------- */
const vp=document.getElementById('viewport');
const cam={x:0,y:0,s:1};
const MIN=0.18, MAX=2.4;
function apply(){
  world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
  document.getElementById('zlevel').textContent=Math.round(cam.s*100)+'%';
  drawMini();
}
function clampScale(s){return Math.max(MIN,Math.min(MAX,s));}
function focusWorld(wx,wy,s){
  s=clampScale(s); cam.s=s;
  cam.x=innerWidth/2 - wx*s; cam.y=innerHeight/2 - wy*s;
}

/* drag */
let dragging=false, lastX=0,lastY=0, moved=0;
const pointers=new Map(); let pinchPrev=null;
vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('.hud'))return;
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY; vp.classList.add('dragging');
  vp.setPointerCapture(e.pointerId); stopTween();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
vp.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){ pinch(); return; }
  if(!dragging)return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  moved+=Math.abs(dx)+Math.abs(dy);
  cam.x+=dx; cam.y+=dy; lastX=e.clientX; lastY=e.clientY; apply();
});
function endPtr(e){ pointers.delete(e.pointerId); if(pointers.size<2)pinchPrev=null; dragging=false; vp.classList.remove('dragging'); hideHelp(); }
vp.addEventListener('pointerup',endPtr);
vp.addEventListener('pointercancel',endPtr);

vp.addEventListener('wheel',e=>{
  e.preventDefault(); stopTween();
  const rect=vp.getBoundingClientRect();
  const px=e.clientX-rect.left, py=e.clientY-rect.top;
  const wx=(px-cam.x)/cam.s, wy=(py-cam.y)/cam.s;
  const factor=Math.exp(-e.deltaY*0.0014);
  const ns=clampScale(cam.s*factor);
  cam.s=ns; cam.x=px-wx*ns; cam.y=py-wy*ns; apply(); hideHelp();
},{passive:false});

function pinch(){
  const pts=[...pointers.values()];
  const cx=(pts[0].x+pts[1].x)/2, cy=(pts[0].y+pts[1].y)/2;
  const dist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
  if(pinchPrev){
    const rect=vp.getBoundingClientRect();
    const px=cx-rect.left, py=cy-rect.top;
    const wx=(px-cam.x)/cam.s, wy=(py-cam.y)/cam.s;
    const ns=clampScale(cam.s*(dist/pinchPrev.dist));
    cam.s=ns; cam.x=px-wx*ns; cam.y=py-wy*ns; apply();
  }
  pinchPrev={dist};
}

/* ---------- camera tween ---------- */
let tween=null;
function stopTween(){ if(tween){cancelAnimationFrame(tween);tween=null;} }
function flyTo(wx,wy,s,dur=900){
  stopTween();
  s=clampScale(s);
  const sx=cam.x, sy=cam.y, ss=cam.s;
  const tx=innerWidth/2-wx*s, ty=innerHeight/2-wy*s;
  let t0=null;
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function step(ts){
    if(t0===null)t0=ts;
    let k=Math.min(1,(ts-t0)/dur); const e=ease(k);
    cam.x=sx+(tx-sx)*e; cam.y=sy+(ty-sy)*e; cam.s=ss+(s-ss)*e; apply();
    if(k<1)tween=requestAnimationFrame(step); else tween=null;
  }
  tween=requestAnimationFrame(step);
}
function flyToNode(id,s){ const c=nodeCenter(id); flyTo(c.x,c.y,s); }

function worldBounds(){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const n of NODES){const e=nodeEls[n.id];
    minX=Math.min(minX,e.offsetLeft);minY=Math.min(minY,e.offsetTop);
    maxX=Math.max(maxX,e.offsetLeft+e.offsetWidth);maxY=Math.max(maxY,e.offsetTop+e.offsetHeight);}
  return {minX,minY,maxX,maxY,w:maxX-minX,h:maxY-minY,cx:(minX+maxX)/2,cy:(minY+maxY)/2};
}
function fitAll(){
  const b=worldBounds();
  const s=clampScale(Math.min(innerWidth/(b.w+260), innerHeight/(b.h+260)));
  flyTo(b.cx,b.cy,s,1000);
}

/* ---------- guided tour ---------- */
let ti=0;
function gotoStop(i){
  ti=(i+TOUR.length)%TOUR.length;
  const s=TOUR[ti];
  document.querySelectorAll('.node.focus-glow').forEach(e=>e.classList.remove('focus-glow'));
  const el=nodeEls[s.id]; if(el)el.classList.add('focus-glow');
  flyToNode(s.id, s.z||.8);
  document.getElementById('tname').textContent=s.name;
  document.getElementById('tcount').textContent=(ti+1)+' / '+TOUR.length;
}
document.getElementById('tnext').onclick=()=>gotoStop(ti+1);
document.getElementById('tprev').onclick=()=>gotoStop(ti-1);
document.getElementById('zin').onclick=()=>flyTo((innerWidth/2-cam.x)/cam.s,(innerHeight/2-cam.y)/cam.s,cam.s*1.35,350);
document.getElementById('zout').onclick=()=>flyTo((innerWidth/2-cam.x)/cam.s,(innerHeight/2-cam.y)/cam.s,cam.s/1.35,350);
document.getElementById('zfit').onclick=fitAll;
addEventListener('keydown',e=>{ if(e.key==='ArrowRight')gotoStop(ti+1); else if(e.key==='ArrowLeft')gotoStop(ti-1); else if(e.key==='f')fitAll(); });

/* ---------- minimap ---------- */
const mm=document.getElementById('mm'), mx=mm.getContext('2d');
function drawMini(){
  const b=worldBounds(); const pad=40;
  const W=mm.width=mm.clientWidth*2, H=mm.height=mm.clientHeight*2;
  mx.clearRect(0,0,W,H);
  const bw=b.w+pad*2, bh=b.h+pad*2;
  const sc=Math.min(W/bw,H/bh);
  const ox=(W-bw*sc)/2 - (b.minX-pad)*sc, oy=(H-bh*sc)/2 - (b.minY-pad)*sc;
  for(const n of NODES){const e=nodeEls[n.id];
    mx.fillStyle=(n.cls==='shot')?'rgba(127,212,200,.5)':(n.cls==='diagram')?'rgba(155,140,255,.5)':'rgba(212,175,55,.45)';
    mx.fillRect(e.offsetLeft*sc+ox, e.offsetTop*sc+oy, e.offsetWidth*sc, e.offsetHeight*sc);}
  const vx=(-cam.x/cam.s), vy=(-cam.y/cam.s), vw=innerWidth/cam.s, vh=innerHeight/cam.s;
  mx.strokeStyle='#f4d77a'; mx.lineWidth=2.5;
  mx.strokeRect(vx*sc+ox, vy*sc+oy, vw*sc, vh*sc);
  mx.fillStyle='rgba(244,215,122,.08)'; mx.fillRect(vx*sc+ox, vy*sc+oy, vw*sc, vh*sc);
  mm._map={sc,ox,oy};
}
mm.addEventListener('click',e=>{
  const r=mm.getBoundingClientRect(); const m=mm._map; if(!m)return;
  const px=(e.clientX-r.left)*2, py=(e.clientY-r.top)*2;
  const wx=(px-m.ox)/m.sc, wy=(py-m.oy)/m.sc;
  flyTo(wx,wy,cam.s,600);
});

let helped=false;
function hideHelp(){ if(helped)return; helped=true; setTimeout(()=>document.getElementById('help').classList.add('hide'),1200); }

function init(){
  buildLinks();
  const first = TOUR[0]?.id || NODES[0]?.id;
  if(first) flyToNode(first, TOUR[0]?.z || .62);
  apply();
  setTimeout(()=>document.getElementById('help').classList.remove('hide'),200);
  setTimeout(hideHelp, 9000);
}
window.addEventListener('load',init);
addEventListener('resize',()=>{ apply(); });
window.__canvas={cam,flyTo,flyToNode,fitAll,gotoStop,worldBounds,nodeCenter,NODES,buildLinks};
</script>
</body>
