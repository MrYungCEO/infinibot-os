<!-- Source for docs/assets/download/smartscreen-step{1,2}*.{webp,png}. Render at 1000x660 @2x with ?step=1 and ?step=2 (headless Chrome), then convert to WebP/PNG. Not published (unreferenced). -->
<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1000px;height:660px;background:#07070a;font-family:"Segoe UI","Noto Sans","Liberation Sans",sans-serif;overflow:hidden}
.scene{position:relative;width:1000px;height:660px;background:radial-gradient(700px 420px at 50% 40%,rgba(251,191,36,.10),transparent 70%),linear-gradient(160deg,#0d0d14,#050507)}
.head{position:absolute;left:44px;top:30px;display:flex;align-items:center;gap:16px;color:#fafafa}
.num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fef3c7,#fbbf24 45%,#d97706);color:#1a1206;font:800 24px/1 "Noto Sans",sans-serif;box-shadow:0 0 0 4px rgba(251,191,36,.18),0 8px 30px rgba(251,191,36,.35)}
.head b{font:700 26px/1.2 "Noto Sans",sans-serif;letter-spacing:.2px}
.head span{display:block;font:400 16px/1.3 "Noto Sans",sans-serif;color:#a1a1aa;margin-top:2px}
.dlg{position:absolute;left:170px;top:118px;width:660px;height:440px;background:#0078d7;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.x{position:absolute;right:16px;top:10px;font:300 22px/1 "Segoe UI","Noto Sans",sans-serif;opacity:.9}
.t{position:absolute;left:40px;top:44px;font:300 34px/1.15 "Segoe UI","Noto Sans",sans-serif;letter-spacing:-.2px}
.p{position:absolute;left:40px;top:112px;width:560px;font:400 16px/1.5 "Segoe UI","Noto Sans",sans-serif}
.more{position:absolute;left:40px;top:178px;font:400 16px/1.4 "Segoe UI","Noto Sans",sans-serif;text-decoration:underline;text-underline-offset:2px}
.kv{position:absolute;left:40px;top:184px;font:400 16px/1.7 "Segoe UI","Noto Sans",sans-serif}
.kv i{font-style:normal;display:inline-block;width:94px}
.bar{position:absolute;left:0;right:0;bottom:0;height:78px;border-top:1px solid rgba(255,255,255,.25)}
.btn{position:absolute;bottom:22px;height:34px;min-width:126px;padding:0 18px;display:grid;place-items:center;background:#cccccc;color:#000;font:400 15px/1 "Segoe UI","Noto Sans",sans-serif;border:2px solid #cccccc}
.b-dont{right:24px}.b-run{right:166px}
.ring{position:absolute;border:4px solid #fbbf24;border-radius:14px;box-shadow:0 0 0 6px rgba(251,191,36,.22),0 0 28px rgba(251,191,36,.65)}
.arrow{position:absolute}
.tag{position:absolute;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:#140f05;border:2px solid #fbbf24;color:#fef3c7;font:700 17px/1 "Noto Sans",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tag .n{width:28px;height:28px;font-size:15px;box-shadow:none}
.foot{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:600 14px/1 "Noto Sans",sans-serif;color:#8e8e98;letter-spacing:.3px}
.foot b{color:#fbbf24;font-weight:700}
.dim{opacity:.55}
</style></head><body><div class="scene" id="scene"></div>
<script>
const step=new URLSearchParams(location.search).get('step')||'1';
const s=document.getElementById('scene');
const svgArrow=(x,y,w,h,path)=>`<svg class="arrow" style="left:${x}px;top:${y}px;overflow:visible" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fbbf24"/></marker></defs><path d="${path}" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)" style="filter:drop-shadow(0 0 6px rgba(251,191,36,.6))"/></svg>`;
if(step==='1'){
 s.innerHTML=`<div class="head"><div class="num">1</div><div><b>Click “More info”</b><span>The first screen only offers “Don’t run”. The link opens the real choice.</span></div></div>
 <div class="dlg"><div class="x">✕</div><div class="t">Windows protected your PC</div>
 <div class="p">Microsoft Defender SmartScreen prevented an unrecognized app from starting. Running this app might put your PC at risk.</div>
 <div class="more">More info</div><div class="bar"></div><div class="btn b-dont">Don’t run</div></div>
 <div class="ring" style="left:${170+28}px;top:${118+170}px;width:104px;height:40px"></div>
 ${svgArrow(330,330,250,120,"M240,110 C170,110 110,60 8,12")}
 <div class="tag" style="left:560px;top:420px"><span class="num n">1</span>Click More info</div>
 <div class="foot"><b>Illustration</b> — reproduction of the Windows SmartScreen dialog, not a screenshot</div>`;
}else{
 s.innerHTML=`<div class="head"><div class="num">2</div><div><b>Click “Run anyway”</b><span>Check it says InfiniBot-Setup-x64.exe, then start the installer.</span></div></div>
 <div class="dlg"><div class="x">✕</div><div class="t">Windows protected your PC</div>
 <div class="p">Microsoft Defender SmartScreen prevented an unrecognized app from starting. Running this app might put your PC at risk.</div>
 <div class="kv"><div><i>App:</i>InfiniBot-Setup-x64.exe</div><div><i>Publisher:</i>Unknown publisher</div></div>
 <div class="bar"></div><div class="btn b-run">Run anyway</div><div class="btn b-dont">Don’t run</div></div>
 <div class="ring" style="left:${170+660-166-126-12}px;top:${118+440-22-34-10}px;width:${126+24}px;height:54px"></div>
 ${svgArrow(250,420,280,130,"M10,120 C100,120 170,100 256,90")}
 <div class="tag" style="left:96px;top:500px"><span class="num n">2</span>Click Run anyway</div>
 <div class="foot"><b>Illustration</b> — reproduction of the Windows SmartScreen dialog, not a screenshot</div>`;
}
</script></body></html>
