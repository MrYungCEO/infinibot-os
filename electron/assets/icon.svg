<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d77a"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#d4af37" stroke-opacity="0.55" stroke-width="10"/>
  <!-- stars -->
  <circle cx="120" cy="110" r="5" fill="#f4d77a" opacity="0.8"/>
  <circle cx="396" cy="132" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="430" cy="330" r="5" fill="#f4d77a" opacity="0.6"/>
  <circle cx="86" cy="350" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="330" cy="84" r="3" fill="#ffffff" opacity="0.5"/>
  <!-- orbit ring -->
  <ellipse cx="256" cy="276" rx="186" ry="76" fill="none" stroke="#d4af37" stroke-opacity="0.65" stroke-width="10" stroke-dasharray="36 22"/>
  <!-- iso platform diamond -->
  <polygon points="256,150 412,276 256,402 100,276" fill="#14110a" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
  <polygon points="256,196 366,276 256,356 146,276" fill="none" stroke="#a87a1e" stroke-width="6" stroke-linejoin="round" opacity="0.8"/>
  <!-- core crystal -->
  <polygon points="256,224 308,276 256,328 204,276" fill="url(#gold)"/>
  <polygon points="256,244 288,276 256,308 224,276" fill="#fff3c4" opacity="0.85"/>
  <!-- satellite dot on orbit -->
  <circle cx="430" cy="252" r="16" fill="url(#gold)"/>
  <circle cx="430" cy="252" r="26" fill="none" stroke="#f4d77a" stroke-opacity="0.45" stroke-width="6"/>
</svg>
