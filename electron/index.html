<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>InfiniBot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0f0f0f;
      --bg-card: #18181b;
      --bg-input: #27272a;
      --border: #3f3f46;
      --border-accent: rgba(255, 215, 0, 0.3);
      --text: #e4e4e7;
      --text-muted: #a1a1aa;
      --accent: #FFD700;
      --accent-hover: #FFC000;
      --success: #22c55e;
      --error: #ef4444;
      --warn: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 24px;
      font-size: 1.75rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    /* Status indicator */
    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--error);
      flex-shrink: 0;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-dot.connecting {
      background: var(--warn);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-weight: 500;
    }

    .status-detail {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* Form elements */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      outline: none;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    /* Checkbox */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: var(--error);
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Logs */
    .logs {
      background: #000;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
      font-size: 12px;
      height: 250px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .log-entry {
      margin-bottom: 2px;
      display: flex;
      gap: 8px;
    }

    .log-time {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .log-message {
      color: var(--success);
      word-break: break-all;
    }

    .log-message.error,
    .log-message.stderr {
      color: var(--error);
    }

    .log-message.warn {
      color: var(--warn);
    }

    .log-message.debug {
      color: var(--text-muted);
    }

    /* Layout */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 16px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>InfiniBot Satellite</h1>

  <!-- Status Card -->
  <div class="card">
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <div>
        <div class="status-text" id="statusText">Disconnected</div>
        <div class="status-detail" id="statusDetail">Not connected to any master</div>
      </div>
    </div>
  </div>

  <!-- Configuration Card -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Configuration</span>
    </div>
    
    <div class="form-group">
      <label for="masterUrl">Master Gateway URL</label>
      <input 
        type="url" 
        id="masterUrl" 
        placeholder="wss://your-master.trycloudflare.com/federation"
      >
    </div>

    <div class="form-group">
      <label for="name">Satellite Name</label>
      <input 
        type="text" 
        id="name" 
        placeholder="my-laptop"
      >
    </div>

    <div class="form-group">
      <div class="checkbox-group">
        <input type="checkbox" id="autoStart" checked>
        <label for="autoStart" style="margin: 0; cursor: pointer;">Auto-start on launch</label>
      </div>
    </div>

    <div class="form-group">
      <div class="checkbox-group">
        <input type="checkbox" id="autoRestart" checked>
        <label for="autoRestart" style="margin: 0; cursor: pointer;">Auto-restart on disconnect</label>
      </div>
    </div>

    <button class="btn btn-primary" onclick="saveConfig()">
      💾 Save Configuration
    </button>
  </div>

  <!-- Controls Card -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Gateway Control</span>
    </div>
    
    <div class="btn-group">
      <button class="btn btn-success" id="btnStart" onclick="startGateway()">
        ▶️ Start
      </button>
      <button class="btn btn-danger" id="btnStop" onclick="stopGateway()" disabled>
        ⏹️ Stop
      </button>
      <button class="btn btn-secondary" onclick="restartGateway()">
        🔄 Restart
      </button>
      <button class="btn btn-secondary" onclick="openLogs()">
        📄 View Log File
      </button>
    </div>
  </div>

  <!-- Logs Card -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Live Logs</span>
      <button class="btn btn-secondary" onclick="clearLogs()" style="padding: 6px 12px; font-size: 12px;">
        Clear
      </button>
    </div>
    <div class="logs" id="logs"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    InfiniBot Satellite v<span id="version">2026.1.41</span> • 
    <a href="https://github.com/infinibot" target="_blank">GitHub</a>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
